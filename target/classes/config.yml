# 데이터 저장 방식을 선택합니다. (YAML, SQLITE, MYSQL 중 하나)
storage:
  type: "YAML"
  mysql:
    host: "localhost"
    port: 3306
    database: "your_database_name"
    username: "your_username"
    password: "your_password"

# 데미지 표시 유형을 선택합니다. (armor_stand 또는 text_display)
display:
  type: "text_display"

# 데미지 표시를 생성하지 않을 엔티티 목록입니다.
blacklist:
  - "TEXT_DISPLAY"
  - "ARMOR_STAND"
  - "PLAYER"